flux_length_days: 15     # Flux: stop tracking NEW storm crossings after this many days (60 steps at 6h)
shoot_length_days: 30    # Shoot: length of each shooting trajectory

forecast_start_times:
  - '2022-09-02 00:00:00'   # Earl
  - '2022-09-09 00:00:00'   # high-activity period
  - '2022-09-14 00:00:00'   # Fiona
  - '2022-09-22 00:00:00'   # Ian


# IC processing mode
single_ic_mode: true  # If true: all GPUs work on ONE IC at a time (recommended for Derecho)
                      # If false: distribute ICs across GPUs (each GPU gets different ICs)
# Single IC mode: which forecast to process (index into forecast_times list)
ic_index: 0  # Only used when single_ic_mode: true

state_A: 1008
state_B: 965
# decorrelation_interface: 1005
interfaces: [1000, 988, 980, 975, 970]
# interfaces: [1005, 1000, 994, 988, 981]

n_flux_total: 1000
n_shoot_per_interface: 500
n_workers: 4

output_dir: './results_test_mar17'